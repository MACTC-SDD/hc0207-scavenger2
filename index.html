<!DOCTYPE html>
<html>

<head>
  <title>HC02.08 - Motion Lab (Bonus)</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
  <meta charset="utf-8">
</head>

<body>
  <h1>Motion Lab</h1>
  <layout>
    <div class="box" id="box1">
      <span class="planet">🌍</span>
      <span class="moon">🌙</span>
      <span class="label">Box #1</span>
    </div>

    <div class="box" id="box2">
      <div class="card">
        <div class="face front"><span class="emoji">🃏</span>Front</div>
        <div class="face back"><span class="emoji">🐉</span>Back</div>
      </div>
    </div>

    <div class="box" id="box3">
      <span class="emoji heart">❤️</span>
      <span class="label">Box #3</span>
    </div>

    <div class="box" id="box4">
      <div class="dots">
        <span class="dot">🟣</span>
        <span class="dot">🟣</span>
        <span class="dot">🟣</span>
      </div>
      <span class="label">Box #4</span>
    </div>

    <div class="box" id="box5">
      <span class="emoji">🦉</span>
      <span class="label">Box #5</span>
    </div>

    <div class="box" id="box6">
      <span class="emoji fish">🐠</span>
      <div class="glass">Box #6</div>
    </div>

    <div class="box custom-box" id="yours"><span class="emoji">✨</span>Yours!</div>
  </layout>

  <div style="height: 50px"></div>
</body>

</html>
